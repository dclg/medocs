<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="foilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="pillShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Fond général icône squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Plaquette miniature en arrière-plan -->
  <rect x="96" y="86" width="320" height="340" rx="36" fill="url(#foilGrad)" filter="url(#dropShadow)" stroke="#94a3b8" stroke-width="4"/>
  
  <!-- Texture gaufrée de la plaquette -->
  <g opacity="0.25" stroke="#ffffff" stroke-width="2">
    <line x1="96" y1="140" x2="416" y2="140" stroke-dasharray="6,6"/>
    <line x1="96" y1="200" x2="416" y2="200" stroke-dasharray="6,6"/>
    <line x1="96" y1="260" x2="416" y2="260" stroke-dasharray="6,6"/>
    <line x1="96" y1="320" x2="416" y2="320" stroke-dasharray="6,6"/>
    <line x1="96" y1="380" x2="416" y2="380" stroke-dasharray="6,6"/>
  </g>

  <!-- Alvéoles de la plaquette -->
  <g fill="#64748b" opacity="0.4">
    <ellipse cx="160" cy="170" rx="34" ry="22"/>
    <ellipse cx="256" cy="170" rx="34" ry="22"/>
    <ellipse cx="352" cy="170" rx="34" ry="22"/>
    
    <ellipse cx="160" cy="240" rx="34" ry="22"/>
    <ellipse cx="256" cy="240" rx="34" ry="22"/>
    <ellipse cx="352" cy="240" rx="34" ry="22"/>

    <ellipse cx="160" cy="310" rx="34" ry="22"/>
    <ellipse cx="352" cy="310" rx="34" ry="22"/>
  </g>

  <!-- Comprimé principal en avant-plan (oblong sécable avec coche) -->
  <g transform="translate(256, 310) rotate(-15)" filter="url(#pillShadow)">
    <!-- Base du comprimé -->
    <rect x="-95" y="-45" width="190" height="90" rx="45" fill="url(#pillGrad)" stroke="#cbd5e1" stroke-width="3"/>
    <!-- Rainure de sécabilité verticale -->
    <line x1="0" y1="-40" x2="0" y2="40" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <!-- Badge de coche verte -->
    <circle cx="50" cy="-20" r="26" fill="#10b981" stroke="#ffffff" stroke-width="4"/>
    <polyline points="40,-20 48,-12 60,-27" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
